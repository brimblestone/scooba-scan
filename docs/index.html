<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scooba Scan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Scooba Scan</title>
<style>
  :root { --bg:#0b0f14; --panel:#121923; --line:#243142; --text:#e8eef6; --dim:#8a9bb0; --ok:#3ddc97; --warn:#ffb454; --bar:#58a6ff;
          --top:env(safe-area-inset-top, 0px); --bottom:env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#000; color:var(--text); font:14px/1.35 -apple-system, system-ui, sans-serif; overscroll-behavior:none; }

  /* The camera fills the whole screen. */
  #stage { position:fixed; inset:0; background:#000; }
  video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  #flash { position:absolute; inset:0; border:5px solid var(--ok); opacity:0; transition:opacity .5s; pointer-events:none; }
  #flash.on { opacity:1; transition:none; }

  /* Optional box that limits OCR to one region (off by default; barcodes always use the whole frame). */
  #reticle { display:none; position:absolute; left:4%; right:4%; top:30%; height:30%; border:2px dashed rgba(255,255,255,.85); border-radius:10px; box-shadow:0 0 0 9999px rgba(0,0,0,.35); pointer-events:none; }
  #stage.crop #reticle { display:block; }
  #reticle span { position:absolute; left:8px; bottom:-26px; font-size:12px; color:#fff; text-shadow:0 1px 3px #000; }

  /* Top bar: live stats + settings button */
  #top { position:absolute; left:8px; right:8px; top:calc(var(--top) + 8px); display:flex; gap:6px; align-items:flex-start; }
  #hud { flex:1; display:flex; gap:6px; flex-wrap:wrap; pointer-events:none; }
  .chip { background:rgba(11,15,20,.72); border:1px solid var(--line); border-radius:8px; padding:3px 8px; font-size:12px; font-variant-numeric:tabular-nums; backdrop-filter:blur(6px); }
  .chip b { color:var(--bar); font-weight:600; }
  #gear { flex:none; width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:rgba(11,15,20,.72); color:var(--text); font-size:20px; backdrop-filter:blur(6px); }

  #start { position:absolute; inset:0; margin:auto; width:220px; height:60px; font-size:18px; font-weight:600; border:0; border-radius:14px; background:var(--bar); color:#04111f; }

  /* Bottom sheet: the latest reads, big. Tap the header to see more. */
  #sheet { position:absolute; left:0; right:0; bottom:0; max-height:36dvh; display:flex; flex-direction:column; background:rgba(11,15,20,.88); border-top:1px solid var(--line); border-radius:18px 18px 0 0; backdrop-filter:blur(10px); padding-bottom:var(--bottom); transition:max-height .2s; }
  #sheet.open { max-height:78dvh; }
  #sheetHead { display:flex; align-items:center; gap:10px; padding:10px 14px 6px; cursor:pointer; user-select:none; }
  #sheetHead::before { content:""; position:absolute; left:50%; top:6px; width:40px; height:4px; margin-left:-20px; border-radius:2px; background:var(--line); }
  #status { flex:1; color:var(--dim); font-size:12px; min-height:1.4em; }
  #count { color:var(--dim); font-size:12px; }
  #list { overflow-y:auto; padding:0 12px 12px; -webkit-overflow-scrolling:touch; }
  #dets { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  #dets li { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; display:grid; grid-template-columns:auto 1fr auto; gap:3px 10px; align-items:baseline; }
  #dets li:first-child { border-color:var(--ok); }
  #dets .kind { font-size:11px; border-radius:4px; padding:1px 6px; color:#04111f; font-weight:600; }
  .k-bar { background:var(--bar); } .k-cas { background:var(--ok); } .k-fz { background:var(--warn); }
  #dets .val { font:600 16px ui-monospace, Menlo, monospace; }
  #dets .meta { color:var(--dim); font-size:12px; text-align:right; }
  #dets .info { grid-column:1/-1; font-size:14px; line-height:1.3; word-break:break-word; }
  #dets li:first-child .info > span { font-size:19px; font-weight:600; line-height:1.25; display:block; }
  #dets .info small { color:var(--dim); display:block; font-size:13px; }
  #dets .info.unk { color:var(--warn); }
  #empty { color:var(--dim); padding:4px 2px 10px; }

  /* Settings panel (hidden until the gear is tapped) */
  #panel { position:absolute; inset:0; display:none; flex-direction:column; gap:12px; padding:calc(var(--top) + 14px) 16px calc(var(--bottom) + 16px); background:rgba(11,15,20,.96); overflow-y:auto; }
  #panel.open { display:flex; }
  #panel h2 { margin:0; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  label { color:var(--dim); font-size:12px; display:grid; gap:2px; }
  select, button.sm { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:14px; }
  label.chk { display:flex; align-items:center; gap:8px; color:var(--text); font-size:15px; }
  .filebtn { cursor:pointer; display:inline-block; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; color:var(--text); font-size:14px; }
  .filebtn input { display:none; }
  #closePanel { align-self:flex-end; }
  #build { color:var(--dim); font-size:11px; margin-top:auto; }

  /* Find mode */
  /* A full-width search bar under the stats, so Find is impossible to miss. */
  #findBtn { position:absolute; left:8px; right:8px; top:calc(var(--top) + 56px); height:48px; display:flex; align-items:center; gap:10px; padding:0 14px; text-align:left; border-radius:14px; border:1px solid var(--bar); background:rgba(11,15,20,.82); color:var(--text); font-size:16px; backdrop-filter:blur(8px); }
  #findBtn .ico { font-size:18px; }
  #findBtn #findLabel { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #findBtn.on { border-color:var(--ok); box-shadow:0 0 0 2px rgba(61,220,151,.35); }
  #targetCard { display:none; margin:0 12px 8px; padding:10px 12px; border:1px solid var(--ok); border-radius:12px; background:rgba(61,220,151,.08); }
  #targetCard.show { display:grid; grid-template-columns:1fr auto; gap:2px 10px; align-items:start; }
  #targetCard .t1 { font-weight:600; font-size:16px; }
  #targetCard .t2 { color:var(--dim); font-size:13px; grid-column:1/-1; }
  #targetCard button { grid-row:1; grid-column:2; background:none; border:0; color:var(--dim); font-size:22px; padding:0 4px; }
  #findPanel { position:absolute; inset:0; display:none; flex-direction:column; gap:10px; padding:calc(var(--top) + 14px) 16px calc(var(--bottom) + 16px); background:rgba(11,15,20,.97); }
  #findPanel.open { display:flex; }
  #findInput { flex:1; min-width:0; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:12px; font-size:17px; }
  #findHint { color:var(--dim); font-size:13px; }
  #findResults { list-style:none; margin:0; padding:0; display:grid; gap:8px; overflow-y:auto; }
  #findResults button { width:100%; text-align:left; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:12px; padding:12px; display:grid; gap:2px; font-size:14px; }
  #findResults .n { font-weight:600; font-size:16px; }
  #findResults small { color:var(--dim); font-size:13px; }
  #found { display:none; position:absolute; left:12px; right:12px; top:calc(var(--top) + 112px); padding:14px 16px; border-radius:16px; background:rgba(14,60,40,.96); border:2px solid var(--ok); box-shadow:0 8px 30px rgba(0,0,0,.5); }
  #found.show { display:grid; gap:4px; }
  #found .big { font-size:26px; font-weight:800; color:var(--ok); }
  #found .nm { font-size:19px; font-weight:600; }
  #found .wh { font-size:15px; }
  #found .ot { font-size:13px; color:#bfe9d4; }
  #found .row { margin-top:8px; }
  #found button { background:var(--ok); color:#04111f; border:0; border-radius:10px; padding:11px 16px; font-size:15px; font-weight:700; }
  #found button.alt { background:transparent; color:var(--text); border:1px solid var(--line); font-weight:600; }
  #stage.found #flash { opacity:1; transition:none; animation:glow 0.9s ease-in-out infinite alternate; }
  #confetti { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #found.show { animation:pop .45s cubic-bezier(.2,1.4,.4,1) both; }
  #found.show .big { animation:wiggle 1.2s ease-in-out .3s 2; }
  @keyframes pop { from { transform:scale(.55); opacity:0; } to { transform:scale(1); opacity:1; } }
  @keyframes glow { from { box-shadow:inset 0 0 18px rgba(61,220,151,.35); } to { box-shadow:inset 0 0 70px rgba(61,220,151,.9); } }
  @keyframes wiggle { 0%,100% { transform:rotate(0) scale(1); } 25% { transform:rotate(-3deg) scale(1.08); } 75% { transform:rotate(3deg) scale(1.08); } }
  @media (prefers-reduced-motion: reduce) {
    #found.show, #found.show .big, #stage.found #flash { animation:none; }
  }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <div id="reticle"><span>Line the CAS number up inside the box</span></div>
  <div id="flash"></div>
  <div id="top">
    <div id="hud">
      <span class="chip">barcode <b id="s-bfps">–</b> fps</span>
      <span class="chip">OCR <b id="s-oms">–</b> ms</span>
      <span class="chip">inventory <b id="s-inv">none</b></span>
      <span class="chip" hidden>cam <b id="s-cam">–</b> · <b id="s-ofps">–</b> OCR fps · skipped <b id="s-skip">0</b></span>
    </div>
    <button id="gear" aria-label="Settings">⚙︎</button>
  </div>
  <button id="findBtn" type="button"><span class="ico">🔍</span><span id="findLabel">Find a chemical — name or CAS</span></button>
  <button id="start">Start camera</button>

  <canvas id="confetti"></canvas>

  <div id="found">
    <div class="big">🎉 FOUND!</div>
    <div class="nm" id="foundName"></div>
    <div class="wh" id="foundWhere"></div>
    <div class="ot" id="foundOthers"></div>
    <div class="row"><button id="keepLooking">Keep looking</button><button class="alt" id="doneFind">Done</button></div>
  </div>

  <div id="sheet">
    <div id="sheetHead"><span id="status">Idle. Tap “Start camera”.</span><span id="count"></span></div>
    <div id="targetCard"><span class="t1" id="tgtName"></span><button id="tgtClear" aria-label="Stop looking">✕</button><span class="t2" id="tgtInfo"></span></div>
    <div id="list">
      <ul id="dets"></ul>
      <div id="empty">Nothing yet. Point the camera at a bottle's barcode tag or label.</div>
    </div>
  </div>

  <div id="panel">
    <button class="sm" id="closePanel">Done</button>
    <h2>Scanning</h2>
    <div class="row">
      <label class="chk"><input type="checkbox" id="useBar" checked> Barcode (whole frame)</label>
      <label class="chk"><input type="checkbox" id="useOcr" checked> CAS text reader (backup)</label>
      <label class="chk"><input type="checkbox" id="useCrop"> Read CAS only inside a box</label>
      <label class="chk"><input type="checkbox" id="useBlur" checked> Skip blurry frames</label>
    </div>
    <h2>Lab inventory</h2>
    <div class="row">
      <label class="filebtn">Load inventory CSV<input type="file" id="invFile" accept=".csv,text/csv,text/plain"></label>
      <button class="sm" id="invClear">Clear inventory</button>
    </div>
    <h2>Tuning</h2>
    <div class="row">
      <label>Camera
        <select id="camRes"><option value="1280x720">720p</option><option value="1920x1080" selected>1080p</option><option value="3840x2160">4K</option></select></label>
      <label>CAS reader zoom
        <select id="ocrScale"><option value="1">×1</option><option value="1.5" selected>×1.5</option><option value="2">×2</option></select></label>
      <label>CAS reader workers
        <select id="workers"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select></label>
      <label>CAS reader mode
        <select id="psm"><option value="11" selected>sparse (11)</option><option value="6">block (6)</option><option value="3">auto (3)</option></select></label>
    </div>
    <div class="row">
      <button class="sm" id="reset">Reset list</button>
      <button class="sm" id="copy">Copy log</button>
    </div>
    <div id="build" data-build="v1.2.0 2026-11-25 16:42Z">Scooba Scan</div>
  </div>

  <div id="findPanel">
    <div class="row" style="flex-wrap:nowrap">
      <input id="findInput" type="search" placeholder="Name or CAS (hyphens optional)" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
      <button class="sm" id="closeFind">Cancel</button>
    </div>
    <div id="findHint"></div>
    <ul id="findResults"></ul>
  </div>
</div>

<script src="./vendor/zxing-wasm/iife/reader/index.js"></script>
<script src="./vendor/tesseract/tesseract.min.js"></script>
<script type="module">
import { extractCas, isValidCas } from './src/cas.js';
import { Inventory, normTag } from './src/inventory.js';

// Absolute URLs (relative to this page) so it works from a subfolder like user.github.io/repo/
const abs = (p) => new URL(p, location.href).href;
const $ = (id) => document.getElementById(id);
const video = $('video');
const status = (t) => ($('status').textContent = t);
// Stamped by `npm run build`; the dev server leaves the placeholder, shown as "dev".
const BUILD = $('build').dataset.build.startsWith('__') ? 'dev' : $('build').dataset.build;
$('build').textContent = `Scooba Scan · build ${BUILD}`;

// ---- lab inventory (stays on this device: kept in memory and in this browser's IndexedDB) ----
let inventory = null;
const idb = () => new Promise((res, rej) => { const r = indexedDB.open('scooba', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function kv(mode, key, value) {
  try {
    const db = await idb();
    return await new Promise((res, rej) => {
      const store = db.transaction('kv', mode === 'get' ? 'readonly' : 'readwrite').objectStore('kv');
      const q = mode === 'get' ? store.get(key) : mode === 'put' ? store.put(value, key) : store.delete(key);
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    });
  } catch { return undefined; } // private mode etc.: still works for this session
}
function setInventory(inv, label) {
  inventory = inv;
  $('s-inv').textContent = inv ? String(inv.size) : 'none';
  if (label) status(label);
  render();
}
async function loadInventoryText(text, name) {
  const inv = Inventory.fromCsv(text);
  if (!inv.size) throw new Error('No rows found. Is this the chemical container export (.csv)?');
  setInventory(inv, 'Inventory loaded: ' + inv.size + ' containers from ' + name + '. Stored on this device only.');
  await kv('put', 'inventory', { text, name, savedAt: Date.now() });
}
async function restoreInventory() {
  const saved = await kv('get', 'inventory');
  if (saved && saved.text) setInventory(Inventory.fromCsv(saved.text), 'Inventory restored: ' + saved.name);
}
// What the inventory says about a detection: { lines: [...], unknown: bool } or null
function describe(d) {
  if (!inventory) return null;
  if (d.kind === 'barcode') {
    const rows = inventory.lookupTag(d.value);
    if (rows.length) {
      const c = rows[0];
      const lines = [[c.name, c.cas].filter(Boolean).join(' · '), [c.where, c.amount].filter(Boolean).join(' · ')].filter(Boolean);
      if (rows.length > 1) lines.push('⚠ ' + rows.length + ' containers share this number');
      return { lines };
    }
    return /^[0-9]{5,11}$/.test(d.value) ? { lines: ['Not in inventory'], unknown: true } : null; // vendor 2D codes etc. are not lab tags
  }
  const rows = inventory.lookupCas(d.value);
  if (!rows.length) return { lines: ['CAS not in inventory'], unknown: true };
  const places = [...new Set(rows.map((r) => r.where).filter(Boolean))].slice(0, 2).join(' | ');
  return { lines: [rows[0].name, rows.length + ' container' + (rows.length > 1 ? 's' : '') + ' in inventory' + (places ? ': ' + places : '')] };
}

let stream = null, workers = [], running = false, t0 = 0, skipped = 0, nWorkers = 2;
const detections = new Map(); // key -> {kind, value, tier, count, firstMs, lastMs}
const barTimes = [], barMs = [], ocrTimes = [];
const log = []; // every OCR/barcode event, for "Copy log"

// ---- camera ---------------------------------------------------------------
async function startCamera() {
  const [w, h] = $('camRes').value.split('x').map(Number);
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: w }, height: { ideal: h } }, audio: false,
  });
  video.srcObject = stream;
  await video.play();
  await new Promise((r) => (video.videoWidth ? r() : video.addEventListener('loadedmetadata', r, { once: true })));
  $('s-cam').textContent = `${video.videoWidth}×${video.videoHeight}`;
}

// ---- barcode (zxing-cpp compiled to WebAssembly) ------------------------------
// The older pure-JS ZXing port could not read the lab's Code 128 tags; zxing-cpp can.
ZXingWASM.prepareZXingModule({
  overrides: { locateFile: (p, prefix) => (p.endsWith('.wasm') ? abs('vendor/zxing-wasm/reader/zxing_reader.wasm') : prefix + p) },
  fireImmediately: true,
});
const bcanvas = document.createElement('canvas');
const bctx = bcanvas.getContext('2d', { willReadFrequently: true });
const BARCODE_LONG_SIDE = 1920;

async function decodeBarcodes() {
  const scale = Math.min(1, BARCODE_LONG_SIDE / Math.max(video.videoWidth, video.videoHeight));
  bcanvas.width = Math.round(video.videoWidth * scale);
  bcanvas.height = Math.round(video.videoHeight * scale);
  bctx.drawImage(video, 0, 0, bcanvas.width, bcanvas.height);
  const img = bctx.getImageData(0, 0, bcanvas.width, bcanvas.height);
  return ZXingWASM.readBarcodes(img, { tryHarder: true, maxNumberOfSymbols: 8 });
}

async function barcodeLoop() {
  while (running) {
    if (!scanPaused && $('useBar').checked && video.readyState >= 2) {
      const t = performance.now();
      try {
        const hits = await decodeBarcodes();
        barMs.push(performance.now() - t); while (barMs.length > 20) barMs.shift();
        for (const h of hits) record('barcode', h.text, h.format, performance.now() - t);
      } catch (e) { status('Barcode error: ' + (e && e.message || e)); await new Promise((r) => setTimeout(r, 1000)); }
      barTimes.push(performance.now()); while (barTimes.length > 20) barTimes.shift();
    }
    await new Promise((r) => setTimeout(r, 0)); // yield to the browser (and OCR callbacks)
  }
}

// ---- OCR region + sharpness --------------------------------------------------
// Where the on-screen reticle sits, in video-pixel coordinates (the video is shown with object-fit: cover).
function reticleRect() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!$('useCrop').checked) return { x: 0, y: 0, w: vw, h: vh };
  const stage = $('stage'), r = $('reticle');
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const scale = Math.max(sw / vw, sh / vh);
  const offX = (vw * scale - sw) / 2, offY = (vh * scale - sh) / 2;
  const x = Math.max(0, (r.offsetLeft + offX) / scale), y = Math.max(0, (r.offsetTop + offY) / scale);
  return { x, y, w: Math.min(vw - x, r.offsetWidth / scale), h: Math.min(vh - y, r.offsetHeight / scale) };
}

const tiny = document.createElement('canvas');
const tctx = tiny.getContext('2d', { willReadFrequently: true });
const sharpHist = [];
// Variance of a Laplacian on a small grayscale copy: higher = sharper.
function sharpness(src, sx, sy, sw, sh) {
  tiny.width = 160; tiny.height = Math.max(8, Math.round(160 * sh / sw));
  tctx.drawImage(src, sx, sy, sw, sh, 0, 0, tiny.width, tiny.height);
  const { data, width, height } = tctx.getImageData(0, 0, tiny.width, tiny.height);
  const g = new Float32Array(width * height);
  for (let i = 0; i < g.length; i++) g[i] = data[i * 4] * 0.3 + data[i * 4 + 1] * 0.59 + data[i * 4 + 2] * 0.11;
  let sum = 0, sum2 = 0, n = 0;
  for (let y = 1; y < height - 1; y++) for (let x = 1; x < width - 1; x++) {
    const i = y * width + x, l = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - width] - g[i + width];
    sum += l; sum2 += l * l; n++;
  }
  return sum2 / n - (sum / n) ** 2;
}
let blurStreak = 0;
function tooBlurry(s) {
  sharpHist.push(s); while (sharpHist.length > 40) sharpHist.shift();
  if (!$('useBlur').checked || sharpHist.length < 8) return false;
  const sorted = [...sharpHist].sort((a, b) => a - b);
  const typicalSharp = sorted[Math.floor(sorted.length * 0.8)];
  if (s < 0.45 * typicalSharp && blurStreak < 5) { blurStreak++; return true; } // never starve: force a frame every 6th
  blurStreak = 0; return false;
}

// ---- OCR (Tesseract.js), several workers in parallel -------------------------
async function ocrLane(worker, canvas) {
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  let lastPsm = $('psm').value;
  while (running) {
    if (scanPaused || !$('useOcr').checked || video.readyState < 2) { await new Promise((r) => setTimeout(r, 200)); continue; }
    const rect = reticleRect();
    const s = sharpness(video, rect.x, rect.y, rect.w, rect.h);
    if (tooBlurry(s)) { skipped++; await new Promise((r) => setTimeout(r, 30)); continue; }
    if ($('psm').value !== lastPsm) { lastPsm = $('psm').value; await worker.setParameters({ tessedit_pageseg_mode: lastPsm }); }
    // Zoom only pays off on a small box; enlarging a whole frame is slow, so the full frame is read at native size.
    const zoom = $('useCrop').checked ? Number($('ocrScale').value) : 1;
    const outW = Math.min(2600, Math.round(rect.w * zoom));
    canvas.width = outW; canvas.height = Math.round(outW * rect.h / rect.w);
    ctx.drawImage(video, rect.x, rect.y, rect.w, rect.h, 0, 0, canvas.width, canvas.height);
    const t = performance.now();
    const { data } = await worker.recognize(canvas);
    const ms = performance.now() - t;
    ocrTimes.push({ at: performance.now(), ms }); while (ocrTimes.length > 12) ocrTimes.shift();
    const found = extractCas(data.text);
    log.push({ t: Math.round(performance.now() - t0), ms: Math.round(ms), size: `${canvas.width}x${canvas.height}`, sharp: Math.round(s), cas: found.map((f) => `${f.cas}${f.tier === 'fuzzy' ? '?' : ''}`) });
    for (const f of found) record('cas', f.cas, f.tier, ms);
  }
}

// ---- detections list + HUD ---------------------------------------------------
function record(kind, value, sub, ms) {
  if (target && !scanPaused) { const m = evalMatch(kind, value); if (m) onFound(m, kind, value); }
  const key = `${kind}:${value}`;
  const now = Math.round(performance.now() - t0);
  const d = detections.get(key);
  if (d) { d.count++; d.lastMs = now; if (kind === 'cas' && sub === 'exact') d.tier = 'exact'; scheduleRender(); }
  else {
    detections.set(key, { kind, value, tier: sub, count: 1, firstMs: now, lastMs: now });
    $('flash').classList.add('on'); setTimeout(() => $('flash').classList.remove('on'), 80);
    if (navigator.vibrate) navigator.vibrate(60);
    $('list').scrollTop = 0;
    render(); // a new bottle: show it immediately
  }
}

// Repeat reads of the same bottle only bump a counter, so redraw at most ~8 times a second.
let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  setTimeout(() => { renderQueued = false; render(); }, 120);
}

function render() {
  const ul = $('dets'); ul.textContent = '';
  // Newest *new* bottle first, so the list does not reshuffle while the same bottle keeps being read.
  const items = [...detections.values()].sort((a, b) => b.firstMs - a.firstMs);
  $('empty').style.display = items.length ? 'none' : '';
  $('count').textContent = items.length ? items.length + ' read' : '';
  for (const d of items) {
    const li = document.createElement('li');
    const kind = document.createElement('span');
    const fuzzy = d.kind === 'cas' && d.tier === 'fuzzy';
    kind.className = 'kind ' + (d.kind === 'barcode' ? 'k-bar' : fuzzy ? 'k-fz' : 'k-cas');
    kind.textContent = d.kind === 'barcode' ? d.tier : fuzzy ? 'CAS?' : 'CAS';
    const val = document.createElement('span'); val.className = 'val'; val.textContent = d.value;
    const meta = document.createElement('span'); meta.className = 'meta';
    meta.textContent = `first ${(d.firstMs / 1000).toFixed(1)}s · ×${d.count}`;
    li.append(kind, val, meta);
    const info = describe(d);
    if (info) {
      const el = document.createElement('div'); el.className = 'info' + (info.unknown ? ' unk' : '');
      info.lines.forEach((t, i) => { const n = document.createElement(i ? 'small' : 'span'); n.textContent = t; el.append(n); });
      li.append(el);
    }
    ul.append(li);
  }
}

function fps(times) {
  if (times.length < 2) return '–';
  return ((times.length - 1) / ((times.at(-1) - times[0]) / 1000)).toFixed(1);
}
const hud = () => ({
  bfps: fps(barTimes),
  bMs: barMs.length ? Math.round(barMs.reduce((x, y) => x + y, 0) / barMs.length) : null,
  ocrMs: ocrTimes.length ? Math.round(ocrTimes.reduce((s, x) => s + x.ms, 0) / ocrTimes.length) : null,
  ocrFps: fps(ocrTimes.map((x) => x.at)),
});
setInterval(() => {
  const h = hud();
  $('s-bfps').textContent = running && $('useBar').checked ? h.bfps : '–';
  if (h.ocrMs !== null) { $('s-oms').textContent = h.ocrMs; $('s-ofps').textContent = h.ocrFps; }
  $('s-skip').textContent = skipped;
}, 500);

// ---- wiring -----------------------------------------------------------------
$('start').addEventListener('click', async () => {
  unlockAudio(); // sounds need a tap to be allowed on iPhone
  $('start').disabled = true; status('Starting camera…');
  try {
    await startCamera();
    nWorkers = Number($('workers').value);
    status(`Loading OCR engine ×${nWorkers} (first time takes a few seconds)…`);
    for (let i = 0; i < nWorkers; i++) {
      const w = await Tesseract.createWorker('eng', 1, {
        workerPath: abs('vendor/tesseract/worker.min.js'),
        corePath: abs('vendor/tesseract-core/'),
        langPath: abs('vendor/lang/'),
        gzip: false,
        logger: () => {},
      });
      await w.setParameters({ tessedit_pageseg_mode: $('psm').value });
      workers.push(w);
    }
    $('start').style.display = 'none';
    running = true; t0 = performance.now();
    status(target ? 'Scanning for ' + target.label + '…' : 'Scanning. Hold a bottle in view, tag or label facing the camera.');
    barcodeLoop();
    workers.forEach((w) => ocrLane(w, document.createElement('canvas')));
  } catch (e) {
    $('start').disabled = false; status('Error: ' + (e && e.message || e));
  }
});
$('camRes').addEventListener('change', async () => { if (stream) { await startCamera(); } });
$('invFile').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { await loadInventoryText(await f.text(), f.name); } catch (err) { status('Could not load inventory: ' + (err && err.message || err)); }
  e.target.value = '';
});
$('invClear').addEventListener('click', async () => { await kv('del', 'inventory'); setInventory(null, 'Inventory cleared.'); });
$('reset').addEventListener('click', () => { detections.clear(); log.length = 0; skipped = 0; t0 = performance.now(); render(); });
$('copy').addEventListener('click', async () => {
  const h = hud();
  const text = JSON.stringify({ build: BUILD, ua: navigator.userAgent, camera: $('s-cam').textContent,
    settings: { zoom: $('ocrScale').value, workers: nWorkers, psm: $('psm').value, boxOnly: $('useCrop').checked, skipBlurry: $('useBlur').checked },
    speed: { barcodeFps: h.bfps, barcodeMsPerFrame: h.bMs, ocrMsAvgLatency: h.ocrMs, ocrFramesPerSec: h.ocrFps, skippedBlurry: skipped },
    inventoryContainers: inventory ? inventory.size : 0, // inventory contents are never included in the log
    detections: [...detections.values()].map((d) => { const i = describe(d); return { ...d, inInventory: i ? !i.unknown : null }; }), ocrFrames: log.slice(-60) }, null, 1);
  try { await navigator.clipboard.writeText(text); status('Log copied.'); } catch { status('Copy blocked by browser.'); }
});
// ---- Find mode -------------------------------------------------------------------
// Pick a chemical (by name, CAS or tag), then scan until a bottle that matches is seen.
let target = null;       // { label, casLabel, cas: Set, tags: Set, containers: [] }
let scanPaused = false;  // true after a match, until "Keep looking"
let seenTags = new Set(); // tags already found for this target, skipped after "Keep looking" so the same bottle isn't re-found
let casQuietUntil = 0;    // after a find by CAS text, ignore further CAS-text matches for a few seconds
let actx = null;
const unlockAudio = () => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch {} };
// A short rising fanfare (C-E-G-C) played with Web Audio; the last note rings out.
function fanfare() {
  try {
    unlockAudio();
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i, a) => {
      const last = i === a.length - 1, o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle'; o.frequency.value = f; o.connect(g); g.connect(actx.destination);
      const t = actx.currentTime + i * 0.11, len = last ? 0.6 : 0.16;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.start(t); o.stop(t + len + 0.02);
    });
  } catch {}
}

// Confetti burst on a canvas over the camera (skipped if the phone asks for reduced motion).
let celebrating = false;
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('confetti'), ctx = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(cv.clientWidth * dpr); cv.height = Math.round(cv.clientHeight * dpr);
  const W = cv.width, H = cv.height, colors = ['#3ddc97', '#58a6ff', '#ffb454', '#ff6b9d', '#ffe66d', '#b388ff'];
  const bits = Array.from({ length: 150 }, () => ({
    x: W * 0.5 + (Math.random() - 0.5) * W * 0.3, y: H * 0.3,
    vx: (Math.random() - 0.5) * 15 * dpr, vy: (-6 - Math.random() * 11) * dpr, g: (0.28 + Math.random() * 0.16) * dpr,
    s: (6 + Math.random() * 8) * dpr, a: Math.random() * 6.28, spin: (Math.random() - 0.5) * 0.4, c: colors[(Math.random() * colors.length) | 0],
  }));
  const start = performance.now(), LIFE = 3500;
  (function frame(now) {
    const t = now - start;
    ctx.clearRect(0, 0, W, H);
    if (!celebrating || t > LIFE) return;
    for (const p of bits) {
      p.vy += p.g; p.vx *= 0.992; p.x += p.vx; p.y += p.vy; p.a += p.spin;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - t / LIFE);
      ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.6); ctx.restore();
    }
    requestAnimationFrame(frame);
  })(start);
}

// Found it: freeze the camera on the bottle, play the fanfare, vibrate (not on iPhone), and throw confetti.
function celebrate() {
  celebrating = true;
  video.pause();
  fanfare();
  if (navigator.vibrate) navigator.vibrate([120, 60, 120, 60, 240]);
  confetti();
}
function endCelebration() {
  celebrating = false;
  const cv = $('confetti'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
  if (running) video.play().catch(() => {}); // un-freeze the camera
}
const whereOf = (cs, n = 3) => [...new Set(cs.map((c) => c.where).filter(Boolean))].slice(0, n).join(' | ');
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

function setTarget(t) {
  target = t; scanPaused = false; seenTags = new Set(); casQuietUntil = 0;
  endCelebration();
  if (!running) $('start').textContent = t ? 'Start scanning' : 'Start camera';
  detections.clear(); render();
  $('stage').classList.remove('found'); $('found').classList.remove('show');
  $('findBtn').classList.toggle('on', !!t);
  $('findLabel').textContent = t ? 'Looking for: ' + t.label : 'Find a chemical — name or CAS';
  $('targetCard').classList.toggle('show', !!t);
  if (t) {
    $('tgtName').textContent = 'Looking for: ' + t.label;
    const n = t.containers.length;
    $('tgtInfo').textContent = [t.casLabel, n ? plural(n, 'container') + ' in inventory' : '', whereOf(t.containers) && 'Try: ' + whereOf(t.containers)].filter(Boolean).join(' · ');
    status(running ? 'Scanning for ' + t.label + '…' : 'Tap “Start camera” to begin looking.');
  } else {
    status(running ? 'Scanning. Hold a bottle in view, tag or label facing the camera.' : 'Idle. Tap “Start camera”.');
  }
}
const targetFromResult = (r) => ({ label: r.label, casLabel: r.cas || '', cas: new Set(r.cas ? [r.cas] : []), tags: new Set(r.kind === 'tag' ? [normTag(r.tag)] : []), containers: r.containers });

// Does this read identify the target? Returns { container? } or null.
function evalMatch(kind, value) {
  if (kind === 'barcode') {
    if (seenTags.has(normTag(value))) return null;
    if (target.tags.has(normTag(value))) return { container: inventory ? inventory.lookupTag(value)[0] : null };
    const rows = inventory ? inventory.lookupTag(value) : [];
    const hit = rows.find((c) => c.cas && target.cas.has(c.cas));
    return hit ? { container: hit } : null;
  }
  // A CAS text read must equal the target exactly (repaired "fuzzy" reads are safe to accept because the target is known).
  return target.cas.has(value) && performance.now() > casQuietUntil ? {} : null;
}

function onFound(m, kind, value) {
  if (scanPaused) return;
  scanPaused = true;
  if (kind === 'barcode') seenTags.add(normTag(value)); else casQuietUntil = performance.now() + 5000;
  celebrate();
  const c = m.container;
  $('foundName').textContent = c ? c.name : target.label;
  $('foundWhere').textContent = c ? [c.id, c.where, c.amount].filter(Boolean).join(' · ')
    : 'Matched the CAS text ' + value + (whereOf(target.containers) ? ' · Try: ' + whereOf(target.containers) : '');
  const others = target.containers.filter((x) => !c || x.id !== c.id);
  $('foundOthers').textContent = others.length ? plural(others.length, 'other container') + ' with this CAS' + (whereOf(others) ? ': ' + whereOf(others) : '') : '';
  $('found').classList.add('show'); $('stage').classList.add('found');
  status('Found it. Tap “Keep looking” for another, or “Done”.');
}

function openFind() {
  unlockAudio();
  $('findPanel').classList.add('open');
  $('findInput').value = ''; $('findResults').textContent = '';
  $('findHint').textContent = inventory ? 'Type a chemical name or CAS number. Hyphens are optional.' : 'Load your inventory (gear) to search by name. You can still type a full CAS number.';
  setTimeout(() => $('findInput').focus(), 60);
}
const closeFind = () => $('findPanel').classList.remove('open');
// "67641", "67 64 1" or "67-64-1" (also with typographic dashes) -> "67-64-1" if it is a valid CAS, else ''.
function asCas(q) {
  const t = q.replace(/[‐-―−]/g, '-').trim();
  if (isValidCas(t)) return t;
  const d = t.replace(/[\s.-]/g, '');
  if (/^[1-9][0-9]{4,9}$/.test(d)) {
    const c = d.slice(0, -3) + '-' + d.slice(-3, -1) + '-' + d.slice(-1);
    if (isValidCas(c)) return c;
  }
  return '';
}
function renderFindResults() {
  const q = $('findInput').value.trim();
  const ul = $('findResults'); ul.textContent = '';
  let results = inventory ? inventory.search(q, 8) : [];
  const typed = asCas(q); // a full, valid CAS typed with or without hyphens, even if it is not in the inventory
  if (typed && !results.some((r) => r.cas === typed)) results = [{ kind: 'chemical', label: 'CAS ' + typed, cas: typed, containers: [] }, ...results];
  const numeric = /^[0-9\s.‐-―−-]+$/.test(q) ? q.replace(/\D/g, '') : '';
  if (q.length >= 2 && !results.length) {
    $('findHint').textContent = numeric.length >= 5 && numeric.length <= 10
      ? 'That is not a valid CAS number (its check digit fails). Check for a typo.'
      : 'No match. Check the spelling, or type a full CAS number.';
  }
  else $('findHint').textContent = inventory ? 'Type a chemical name or CAS number. Hyphens are optional.' : 'Load your inventory (gear) to search by name. You can still type a full CAS number.';
  for (const r of results) {
    const li = document.createElement('li'), b = document.createElement('button');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = r.label;
    const d = document.createElement('small');
    d.textContent = r.kind === 'tag'
      ? ['Tag ' + r.tag, r.cas, r.containers[0].where].filter(Boolean).join(' · ')
      : [r.cas, r.containers.length ? plural(r.containers.length, 'container') : '', whereOf(r.containers, 1)].filter(Boolean).join(' · ');
    b.append(n, d);
    b.addEventListener('click', () => { setTarget(targetFromResult(r)); closeFind(); });
    li.append(b); ul.append(li);
  }
}
$('findBtn').addEventListener('click', openFind);
$('closeFind').addEventListener('click', closeFind);
$('findInput').addEventListener('input', renderFindResults);
$('findInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { const first = $('findResults').querySelector('button'); if (first) first.click(); e.preventDefault(); } });
$('tgtClear').addEventListener('click', () => setTarget(null));
$('doneFind').addEventListener('click', () => setTarget(null));
$('keepLooking').addEventListener('click', () => {
  endCelebration();
  scanPaused = false; $('found').classList.remove('show'); $('stage').classList.remove('found');
  status('Scanning for ' + target.label + '…');
});

// ---- screen controls ----------------------------------------------------------
$('gear').addEventListener('click', () => $('panel').classList.add('open'));
$('closePanel').addEventListener('click', () => $('panel').classList.remove('open'));
$('sheetHead').addEventListener('click', () => $('sheet').classList.toggle('open'));
const syncCrop = () => $('stage').classList.toggle('crop', $('useCrop').checked);
$('useCrop').addEventListener('change', syncCrop); syncCrop();
// Keep the camera running when the phone is rotated or the browser bars slide away.
addEventListener('resize', () => { if (running && video.paused && !scanPaused) video.play().catch(() => {}); });

restoreInventory().then(() => render());
render();
</script>
</body>
</html>
