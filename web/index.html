<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scooba Scan — scanner spike</title>
<style>
  :root { --bg:#0b0f14; --panel:#121923; --line:#243142; --text:#e8eef6; --dim:#8a9bb0; --ok:#3ddc97; --warn:#ffb454; --bar:#58a6ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:14px/1.35 -apple-system, system-ui, sans-serif; }
  body { min-height:100dvh; display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom); }
  #stage { position:relative; width:100%; background:#000; aspect-ratio:3/4; max-height:55dvh; overflow:hidden; }
  video { width:100%; height:100%; object-fit:cover; display:block; }
  #hud { position:absolute; left:8px; top:8px; right:8px; display:flex; gap:6px; flex-wrap:wrap; pointer-events:none; }
  .chip { background:rgba(11,15,20,.78); border:1px solid var(--line); border-radius:8px; padding:3px 8px; font-variant-numeric:tabular-nums; }
  .chip b { color:var(--bar); font-weight:600; }
  #flash { position:absolute; inset:0; border:4px solid var(--ok); opacity:0; transition:opacity .5s; pointer-events:none; }
  #flash.on { opacity:1; transition:none; }
  #start { position:absolute; inset:0; margin:auto; width:200px; height:56px; font-size:17px; font-weight:600; border:0; border-radius:12px; background:var(--bar); color:#04111f; }
  main { padding:10px 12px; display:grid; gap:10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  label { color:var(--dim); font-size:12px; display:grid; gap:2px; }
  select, button.sm { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; font-size:14px; }
  label.chk { display:flex; align-items:center; gap:6px; color:var(--text); font-size:14px; }
  h2 { margin:0; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); }
  #dets { list-style:none; margin:6px 0 0; padding:0; display:grid; gap:6px; }
  #dets li { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; display:grid; grid-template-columns:auto 1fr auto; gap:2px 10px; align-items:baseline; }
  #dets .kind { font-size:11px; border-radius:4px; padding:1px 6px; color:#04111f; font-weight:600; }
  .k-bar { background:var(--bar); } .k-cas { background:var(--ok); } .k-fz { background:var(--warn); }
  #dets .val { font:600 16px ui-monospace, Menlo, monospace; }
  #dets .meta { color:var(--dim); font-size:12px; text-align:right; }
  #empty { color:var(--dim); }
  #status { color:var(--dim); font-size:12px; min-height:1.4em; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <div id="flash"></div>
  <div id="hud">
    <span class="chip">cam <b id="s-cam">–</b></span>
    <span class="chip">barcode <b id="s-bfps">–</b> fps</span>
    <span class="chip">OCR <b id="s-oms">–</b> ms · <b id="s-ofps">–</b> fps</span>
  </div>
  <button id="start">Start camera</button>
</div>
<main>
  <div class="row">
    <label>Camera
      <select id="camRes"><option value="1280x720">720p</option><option value="1920x1080" selected>1080p</option><option value="3840x2160">4K</option></select></label>
    <label>OCR image long side
      <select id="ocrSize"><option value="1280">1280</option><option value="1920" selected>1920</option><option value="2560">2560</option><option value="0">native</option></select></label>
    <label>OCR mode
      <select id="psm"><option value="11" selected>sparse (11)</option><option value="6">block (6)</option><option value="3">auto (3)</option></select></label>
  </div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="useBar" checked> Barcode</label>
    <label class="chk"><input type="checkbox" id="useOcr" checked> OCR</label>
    <button class="sm" id="reset">Reset list</button>
    <button class="sm" id="copy">Copy log</button>
  </div>
  <div id="status">Idle. Tap “Start camera”.</div>
  <section>
    <h2>Detections</h2>
    <ul id="dets"></ul>
    <div id="empty">Nothing yet. Point at a bottle label or barcode tag.</div>
  </section>
  <footer id="build" data-build="__BUILD__" style="color:var(--dim);font-size:11px">Scooba Scan prototype</footer>
</main>

<script src="./vendor/zxing/index.min.js"></script>
<script src="./vendor/tesseract/tesseract.min.js"></script>
<script type="module">
import { extractCas } from './src/cas.js';

// Absolute URLs (relative to this page) so it works from a subfolder like user.github.io/repo/
const abs = (p) => new URL(p, location.href).href;
const $ = (id) => document.getElementById(id);
const video = $('video');
const status = (t) => ($('status').textContent = t);
// Stamped by `npm run build`; the dev server leaves the placeholder, shown as "dev".
const BUILD = $('build').dataset.build.startsWith('__') ? 'dev' : $('build').dataset.build;
$('build').textContent = `Scooba Scan prototype · build ${BUILD}`;

let stream = null, worker = null, running = false, t0 = 0;
const detections = new Map(); // key -> {kind, value, tier, count, firstMs, lastMs}
const barTimes = [], ocrTimes = [];
const log = []; // every OCR/barcode event, for "Copy log"

// ---- camera ---------------------------------------------------------------
async function startCamera() {
  const [w, h] = $('camRes').value.split('x').map(Number);
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: w }, height: { ideal: h } }, audio: false,
  });
  video.srcObject = stream;
  await video.play();
  await new Promise((r) => (video.videoWidth ? r() : video.addEventListener('loadedmetadata', r, { once: true })));
  $('s-cam').textContent = `${video.videoWidth}×${video.videoHeight}`;
}

// ---- barcode (ZXing) --------------------------------------------------------
const zx = (() => {
  const hints = new Map();
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  const reader = new ZXing.MultiFormatReader();
  reader.setHints(hints);
  return reader;
})();
const bcanvas = document.createElement('canvas');
const bctx = bcanvas.getContext('2d', { willReadFrequently: true });

function decodeBarcode() {
  const scale = Math.min(1, 960 / Math.max(video.videoWidth, video.videoHeight));
  bcanvas.width = Math.round(video.videoWidth * scale);
  bcanvas.height = Math.round(video.videoHeight * scale);
  bctx.drawImage(video, 0, 0, bcanvas.width, bcanvas.height);
  const source = new ZXing.HTMLCanvasElementLuminanceSource(bcanvas);
  try {
    const r = zx.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(source)));
    return { text: r.getText(), format: ZXing.BarcodeFormat[r.getBarcodeFormat()] };
  } catch { return null; }
}

async function barcodeLoop() {
  while (running) {
    if ($('useBar').checked && video.readyState >= 2) {
      const t = performance.now();
      const hit = decodeBarcode();
      barTimes.push(performance.now()); while (barTimes.length > 20) barTimes.shift();
      if (hit) record('barcode', hit.text, hit.format, performance.now() - t);
    }
    await new Promise((r) => setTimeout(r, 0)); // yield to the browser (and OCR callbacks)
  }
}

// ---- OCR (Tesseract.js) -----------------------------------------------------
const ocanvas = document.createElement('canvas');
const octx = ocanvas.getContext('2d', { willReadFrequently: true });

function grabForOcr() {
  const long = Number($('ocrSize').value) || Math.max(video.videoWidth, video.videoHeight);
  const scale = Math.min(1, long / Math.max(video.videoWidth, video.videoHeight));
  ocanvas.width = Math.round(video.videoWidth * scale);
  ocanvas.height = Math.round(video.videoHeight * scale);
  octx.drawImage(video, 0, 0, ocanvas.width, ocanvas.height);
  return ocanvas;
}

async function ocrLoop() {
  let lastPsm = $('psm').value;
  while (running) {
    if (!$('useOcr').checked || video.readyState < 2) { await new Promise((r) => setTimeout(r, 200)); continue; }
    if ($('psm').value !== lastPsm) { lastPsm = $('psm').value; await worker.setParameters({ tessedit_pageseg_mode: lastPsm }); }
    const img = grabForOcr();
    const t = performance.now();
    const { data } = await worker.recognize(img);
    const ms = performance.now() - t;
    ocrTimes.push({ at: performance.now(), ms }); while (ocrTimes.length > 10) ocrTimes.shift();
    const found = extractCas(data.text);
    log.push({ t: Math.round(performance.now() - t0), ms: Math.round(ms), size: `${img.width}x${img.height}`, cas: found.map((f) => `${f.cas}${f.tier === 'fuzzy' ? '?' : ''}`) });
    for (const f of found) record('cas', f.cas, f.tier, ms);
  }
}

// ---- detections list + HUD ---------------------------------------------------
function record(kind, value, sub, ms) {
  const key = `${kind}:${value}`;
  const now = Math.round(performance.now() - t0);
  const d = detections.get(key);
  if (d) { d.count++; d.lastMs = now; if (kind === 'cas' && sub === 'exact') d.tier = 'exact'; }
  else {
    detections.set(key, { kind, value, tier: sub, count: 1, firstMs: now, lastMs: now });
    $('flash').classList.add('on'); setTimeout(() => $('flash').classList.remove('on'), 80);
    if (navigator.vibrate) navigator.vibrate(60);
  }
  render();
}

function render() {
  const ul = $('dets'); ul.textContent = '';
  const items = [...detections.values()].sort((a, b) => b.lastMs - a.lastMs);
  $('empty').style.display = items.length ? 'none' : '';
  for (const d of items) {
    const li = document.createElement('li');
    const kind = document.createElement('span');
    const fuzzy = d.kind === 'cas' && d.tier === 'fuzzy';
    kind.className = 'kind ' + (d.kind === 'barcode' ? 'k-bar' : fuzzy ? 'k-fz' : 'k-cas');
    kind.textContent = d.kind === 'barcode' ? d.tier : fuzzy ? 'CAS?' : 'CAS';
    const val = document.createElement('span'); val.className = 'val'; val.textContent = d.value;
    const meta = document.createElement('span'); meta.className = 'meta';
    meta.textContent = `first ${(d.firstMs / 1000).toFixed(1)}s · ×${d.count}`;
    li.append(kind, val, meta); ul.append(li);
  }
}

function fps(times) {
  if (times.length < 2) return '–';
  return ((times.length - 1) / ((times.at(-1) - times[0]) / 1000)).toFixed(1);
}
setInterval(() => {
  $('s-bfps').textContent = running && $('useBar').checked ? fps(barTimes) : '–';
  if (ocrTimes.length) {
    const avg = ocrTimes.reduce((s, x) => s + x.ms, 0) / ocrTimes.length;
    $('s-oms').textContent = Math.round(avg);
    $('s-ofps').textContent = fps(ocrTimes.map((x) => x.at));
  }
}, 500);

// ---- wiring -----------------------------------------------------------------
$('start').addEventListener('click', async () => {
  $('start').disabled = true; status('Starting camera…');
  try {
    await startCamera();
    status('Loading OCR engine (first time takes a few seconds)…');
    worker = await Tesseract.createWorker('eng', 1, {
      workerPath: abs('vendor/tesseract/worker.min.js'),
      corePath: abs('vendor/tesseract-core/'),
      langPath: abs('vendor/lang/'),
      gzip: false,
      logger: () => {},
    });
    await worker.setParameters({ tessedit_pageseg_mode: $('psm').value });
    $('start').style.display = 'none';
    running = true; t0 = performance.now();
    status('Scanning. Hold the label steady, 15–30 cm away.');
    barcodeLoop(); ocrLoop();
  } catch (e) {
    $('start').disabled = false; status('Error: ' + (e && e.message || e));
  }
});
$('camRes').addEventListener('change', async () => { if (stream) { await startCamera(); } });
$('reset').addEventListener('click', () => { detections.clear(); log.length = 0; t0 = performance.now(); render(); });
$('copy').addEventListener('click', async () => {
  const text = JSON.stringify({ build: BUILD, ua: navigator.userAgent, camera: $('s-cam').textContent, ocrSize: $('ocrSize').value, psm: $('psm').value,
    detections: [...detections.values()], ocrFrames: log.slice(-60) }, null, 1);
  try { await navigator.clipboard.writeText(text); status('Log copied.'); } catch { status('Copy blocked by browser.'); }
});
render();
</script>
</body>
</html>
